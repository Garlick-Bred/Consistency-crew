<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consistency Crew</title>
<link rel="icon" type="image/png" href="cc-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a coach's training floor — loud, confident, fast to use between sets.
   IDEA: calibrated competition plates. Red 25, blue 20, yellow 15, green 10 colour-code every muscle group.
   PICTURE: the dark "up next" card with a plate-shaped weekly ring; the live set table is the hero in workout mode.
   COLOUR and TYPE: white floor / rubber-black night, plate red as the one action colour; Barlow Condensed caps for numbers + titles, Barlow for text.
   LAYOUT: sidebar on desktop, bottom tabs on phones; sheets slide in for builder, library and clients. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0d0d0f);--panel:light-dark(#f4f4f2,#17171a);--panel2:light-dark(#e9e9e6,#232327);
--line:light-dark(#e1e1dc,#2b2b30);--ink:light-dark(#111113,#f2f2ef);--mute:light-dark(#6a6a70,#9b9ba3);
--brand:#188e5c;--brand2:#1fa86d;--danger:#d92d20;--red:var(--danger);--blue:#1d4ed8;--yellow:#f5c400;--green:#1e9e4a;--rub:#111113;
--f:'Barlow',system-ui,-apple-system,Segoe UI,sans-serif;--d:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
--sh:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(0,0,0,.07)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow-x:clip;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
a{color:inherit}
h1,h2,h3{margin:0;font-family:var(--d);font-weight:800;line-height:1.02;text-wrap:balance}
p{margin:0}
.ic{flex:none;display:block}
.sm{font-size:13px;color:var(--mute)}
.num{font-family:var(--d);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 24px;text-decoration:none}
.logo svg{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:12px;padding:0 12px;min-height:46px;border-radius:12px;border:0;background:none;font-weight:600;font-size:15px;text-align:left;color:var(--mute);text-decoration:none}
.nav:hover{background:var(--panel);color:var(--ink)}
.nav.on{background:var(--ink);color:var(--bg)}
.side-f{margin-top:auto;display:grid;gap:8px}
.sync{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mute);padding:0 12px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.sync.saving i{background:var(--yellow)}.sync.err i,.sync.local i{background:var(--mute)}
.topbar{display:none}
.tabbar{display:none}
main{padding:30px clamp(16px,4vw,52px) 140px;max-width:1240px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:clamp(36px,5vw,54px);text-transform:uppercase;font-style:italic}
.hero h2,.lv-main h2,.fin h2,.empty h3,.sec-h h2{font-style:italic}
.brand-l,.brand-d{display:block}.brand-d{display:none}
:root[data-theme=dark] .brand-l{display:none}:root[data-theme=dark] .brand-d{display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .brand-l{display:none}:root:not([data-theme=light]) .brand-d{display:block}}
.wm{height:40px;width:auto}.topbar .wm{height:30px}
img.pl{width:auto;height:72px}
.fin .wm{height:34px;margin-bottom:6px}
.ph .sm{font-size:15px;margin-bottom:6px}
.pav{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;font:italic 800 18px/1 var(--d);flex:none;letter-spacing:.01em}
.pbtn{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--panel);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;color:var(--ink);min-height:44px;margin-left:auto}
.pbtn:hover{background:var(--panel2)}.pbtn-t{display:grid;text-align:left;line-height:1.15}.pbtn-t b{font-size:14.5px}.pbtn-t span{font-size:12.5px;color:var(--mute);font-weight:600}
@media(max-width:520px){.pbtn{padding:0;background:none}.pbtn-t{display:none}}
.st{gap:26px}.st-sec{display:grid;gap:14px}.st-h{font:italic 800 20px/1 var(--d);text-transform:uppercase;margin:0;letter-spacing:.01em}
.st-prof{display:flex;gap:16px;align-items:flex-end}
.st-cols{display:flex;gap:10px;flex-wrap:wrap}.st-col{width:36px;height:36px;border-radius:50%;background:var(--c);border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}.st-col.on{outline:3px solid var(--c);outline-offset:3px}
.st-list{background:var(--panel);border-radius:18px;padding:2px 14px}
.tgl-row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:14px 0;text-align:left;color:var(--ink);cursor:pointer;font:inherit}.tgl-row+.tgl-row{border-top:1px solid var(--line)}
.tgl-row .grow{display:grid;gap:3px}.tgl-row b{font-size:15px}
.tgl{width:50px;height:30px;border-radius:999px;background:var(--panel2);position:relative;flex:none;transition:background .2s}.tgl i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on{background:var(--brand)}.tgl.on i{transform:translateX(20px)}
@media(max-width:899px){
 .app{grid-template-columns:minmax(0,1fr)}
 .side{display:none}
 .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
 .topbar .logo{padding:0;font-size:21px}
 .tabbar{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
 .tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mute);font-size:11.5px;font-weight:600;padding:6px 0;min-height:50px;border-radius:12px}
 .tab.on{color:var(--brand)}
 main{padding-top:20px}
}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;font-weight:700;font-size:15px;background:var(--panel2);color:var(--ink);white-space:nowrap;text-decoration:none;transition:transform .12s,background .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn.red{background:var(--brand);color:#fff}.btn.red:hover{background:var(--brand2)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.ghost:hover{box-shadow:inset 0 0 0 1.5px var(--mute)}
.btn.lg{min-height:56px;padding:0 28px;font-size:17px}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.dk{background:#26262b;color:#fff}
.btn.lt{background:#fff;color:#111}
.btn.danger{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--danger) 40%,transparent)}
.icb{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;border:0;background:transparent;color:inherit}
.icb:hover{background:var(--panel2)}
.icb.sm{width:34px;height:34px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;padding-bottom:2px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
.chip:hover{border-color:var(--mute)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--ink);white-space:nowrap}
.tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}

/* cards & sections */
.sec{margin-top:34px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:26px;text-transform:uppercase}
.lnk{border:0;background:none;color:var(--brand);font-weight:700;font-size:14px;padding:6px 0}
.card{background:var(--panel);border-radius:22px;padding:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.empty{border:2px dashed var(--line);border-radius:22px;padding:34px 22px;text-align:center;display:grid;justify-items:center;gap:10px}
.empty svg.pl{width:64px;height:64px;color:var(--brand)}
.empty h3{font-size:24px;text-transform:uppercase}
.empty p{color:var(--mute);max-width:44ch}

/* hero */
.hero{background:var(--rub);color:#f4f4f1;border-radius:30px;padding:clamp(22px,3.2vw,38px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;position:relative;overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;width:420px;height:540px;right:-90px;top:-60px;background:url(cc-icon-w.png) center/contain no-repeat;opacity:.06;transform:rotate(-8deg);z-index:-1;pointer-events:none}
.hero .lbl{color:#b8b8bd;font-weight:600;font-size:14.5px;display:flex;align-items:center;gap:8px}
.hero .lbl b{color:#fff}
.hero h2{font-size:clamp(34px,4.6vw,56px);text-transform:uppercase;margin:8px 0 12px;max-width:18ch}
.hero .chips{margin-bottom:16px}
.hero .tag{color:#f4f4f1;background:rgba(255,255,255,.08)}
.hlist{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:2px;max-width:520px}
.hlist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-weight:600}
.hlist li span{color:#a9a9ae;font-weight:500;white-space:nowrap}
.hlist li{align-items:center}.hlist li .hn{display:flex;align-items:center;gap:12px;min-width:0;color:inherit;font-weight:600;white-space:normal}.hlist .hth{width:38px;height:38px;border-radius:10px;overflow:hidden;flex:none}
.hact{display:flex;gap:10px;flex-wrap:wrap}
.hring{display:grid;justify-items:center;align-content:start;gap:6px;text-align:center}
.hring .sm{color:#a9a9ae}
.ring .r-o{fill:#1d1d21}.ring .r-t{fill:none;stroke:#2c2c31;stroke-width:16}
.ring .r-p{fill:none;stroke:var(--brand);stroke-width:16;stroke-linecap:round}
.ring .r-i{fill:#151518;stroke:#2c2c31;stroke-width:2}
.ring text{fill:#fff;font-family:var(--d);font-weight:800;text-anchor:middle}
.ring.anim .r-p{animation:ringfill 1.2s cubic-bezier(.2,.8,.2,1) .15s both}
@keyframes ringfill{from{stroke-dashoffset:var(--C)}}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px 4px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}
.wd{display:grid;justify-items:center;gap:6px;font-size:12.5px;color:#9d9da3;font-weight:600;background:none;border:0;padding:4px 0;cursor:pointer;border-radius:14px;font-family:inherit;min-height:44px}
.wd:hover b{background:#2a2a30}.wd.on:hover b{background:var(--brand2)}
.wd.sel span{color:#fff}.wd.sel b{outline:2px solid var(--brand);outline-offset:3px}
.wk-h{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.wk-l{font:600 13px 'Barlow',sans-serif;color:#a9a9ae;text-align:center}.wk-l .lnk{color:#7FD3AC;font-size:13px;padding:0;min-height:0}
.wk-nav{color:#d8d8d5;background:#1f1f23;width:36px;height:36px}
.wd b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 17px var(--d);color:#e8e8e5;background:#1f1f23}
.wd.on b{background:var(--brand);color:#fff}
.wd.td b{box-shadow:0 0 0 2px #fff}
.wd.pl b{box-shadow:inset 0 0 0 2px #4a4a52}
@media(max-width:640px){.hero{grid-template-columns:minmax(0,1fr)}.hring{grid-row:1;grid-template-columns:auto 1fr;justify-items:start;align-items:center;text-align:left;gap:14px}.hring svg{width:92px;height:92px}.hero::after{display:none}.wd b{width:34px;height:34px;font-size:15px}}

.qa{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.stat{background:var(--panel);border-radius:20px;padding:16px 18px}
.stat .v{font:800 clamp(32px,3.6vw,42px)/1 var(--d);margin:6px 0 4px;white-space:nowrap}
.stat .v small{font-size:.5em;color:var(--mute);margin-left:3px}
.delta{font-size:13px;font-weight:700}
.delta.up{color:var(--brand)}.delta.dn{color:var(--danger)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}

/* rows */
.rows{display:grid;gap:2px}
.row{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:14px;border:0;background:none;text-align:left;width:100%}
button.row:hover{background:var(--panel)}
.grow{flex:1}
.row b{display:block;font-weight:700}
.av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font:800 17px var(--d);background:var(--c);color:var(--ct,#fff);letter-spacing:.02em}
.av.lg{width:72px;height:72px;font-size:28px}
.datebox{width:46px;flex:none;text-align:center;border-radius:12px;background:var(--panel2);padding:5px 0}
.datebox b{font:800 20px/1 var(--d)}
.datebox span{font-size:11px;color:var(--mute);font-weight:700;display:block}
.bar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px}

/* workout cards */
.wc{background:var(--panel);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.wc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.who{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.who .av{width:26px;height:26px;font-size:12px}
.wc h3{font-size:27px;text-transform:uppercase}
.mbar{display:flex;height:6px;border-radius:6px;overflow:hidden;gap:2px}
.mbar i{background:var(--c)}
.wc ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14.5px}
.wc li{display:flex;justify-content:space-between;gap:10px}
.wc li span{color:var(--mute);white-space:nowrap}
.wc-f{display:flex;gap:8px;margin-top:auto;padding-top:4px;align-items:center}
.done-b{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--green)}
.invite{display:grid;gap:10px}.inv-h{display:flex;gap:8px;align-items:center}.invite.ok .inv-h{color:var(--brand)}
.steps-ol{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}
.invlink{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:6px 6px 6px 12px}.invlink code{flex:1;font-size:12.5px;overflow-wrap:anywhere;color:var(--mute)}
.pastbtn{border:2px dashed var(--line);background:none;align-items:center;justify-content:center;font-weight:700;color:var(--mute);min-height:120px}
.menu{position:absolute;right:14px;bottom:62px;background:var(--bg);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:6px;display:grid;min-width:190px;z-index:5;border:1px solid var(--line)}
.menu button{display:flex;gap:10px;align-items:center;border:0;background:none;padding:10px 12px;border-radius:10px;font-weight:600;text-align:left}
.menu button:hover{background:var(--panel)}
.menu .del{color:var(--danger)}

/* library */
.toolbar{display:grid;gap:12px;margin-bottom:18px}
.search{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:16px;padding:0 14px;min-height:50px}
.search input{border:0!important;background:none!important;padding:0!important;outline:0;flex:1;font-size:16px;min-height:48px}
.lgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
@media(max-width:560px){.lgrid{gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid .ex{border-radius:16px}.lgrid .vbadge{font-size:0;gap:0;width:26px;height:26px;padding:0;justify-content:center;top:9px;right:9px}.lgrid .mw:has(.vbadge) .art i{margin-right:28px}}
.ex{border:0;background:var(--panel);border-radius:20px;padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column}
.ex:hover .mx{transform:scale(1.03)}
.ex .mw{aspect-ratio:4/3;overflow:hidden;position:relative}
.ex .mx{width:100%;height:100%;transition:transform .35s}
.ex .meta{padding:12px 14px 14px;display:grid;gap:4px}
.ex .meta b{font:800 21px/1.05 var(--d);text-transform:uppercase}
.vbadge{position:absolute;right:12px;top:12px;display:inline-flex;gap:5px;align-items:center;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;backdrop-filter:blur(6px)}
.art{--ab:#111113;--af:#fff;--al:#7FD3AC;--aw:#188E5C;--ao:.42;background:var(--ab);color:var(--af);position:relative;overflow:hidden;width:100%;height:100%;min-height:40px;container-type:size;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.art.g{--ab:#188E5C;--al:rgba(255,255,255,.86);--aw:#fff;--ao:.13;box-shadow:none}
.art.l{--ab:#F1F2F0;--af:#111113;--al:#0F6B44;--aw:#188E5C;--ao:.13;box-shadow:inset 0 0 0 1px rgba(17,17,19,.06)}
.art .ai{--pad:clamp(10px,7.5cqw,28px);position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:var(--pad)}
.art i{position:relative;font:700 clamp(10.5px,6cqh,13px)/1.2 'Barlow',system-ui,sans-serif;font-style:normal;letter-spacing:.04em;text-transform:uppercase;color:var(--al);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.art .nm{position:relative;display:flex;flex-direction:column;gap:.5em}
.art b{--a:calc(60cqw / var(--t,8));--h:calc((100cqh - 2 * var(--pad) - 30px - var(--p,0) * 22px) / .9);display:block;font:italic 800 clamp(13px,min(calc(80cqw / var(--w,4)),40cqh,max(min(var(--a),var(--h)),min(var(--a) * 2,var(--h) / 2),min(var(--a) * 3,var(--h) / 3),min(var(--a) * 4,var(--h) / 4))),96px)/.88 var(--d);text-transform:uppercase;letter-spacing:-.008em;text-wrap:pretty}
.art em{font:600 clamp(10.5px,5.4cqh,15px)/1.2 'Barlow',system-ui,sans-serif;font-style:normal;color:var(--af);opacity:.75}
.art .wm{position:absolute;right:-.02em;top:-.2em;font:italic 800 72cqh/1 var(--d);letter-spacing:-.03em;color:var(--aw);opacity:var(--ao);pointer-events:none;display:none;white-space:nowrap}
@container (min-width:420px) and (min-height:240px){.art .wm{display:block}}
@container (max-width:200px){.art .eq{display:none}}
.art.s .ai{padding:15cqh 16cqw;justify-content:flex-end;align-items:flex-start}.art.s b{font-size:clamp(13px,44cqh,30px);line-height:.85;letter-spacing:-.01em}

const Q={};
function setSync(st){const t={ok:'Synced',saving:'Saving…',err:'Not saved',local:'Saved on this device'}[st];$$('.sync').forEach(el=>{el.className='sync '+st;el.innerHTML='<i></i>'+t})}
function errMsg(e){const c=e&&e.code;return c==='quota_exceeded'?'Storage is full — delete old items':c==='invalid_argument'?'You don’t have permission to save here':c==='resource_exhausted'?'Saving too fast — try again':'Couldn’t save — check your connection'}
function queue(key,fn){setSync('saving');const p=(Q[key]||Promise.resolve()).catch(()=>{}).then(fn);Q[key]=p;return p.then(()=>{setSync('ok')},e=>{setSync('err');toast(errMsg(e),'err')})}
function colPath(col,obj){
  if(ROLE==='client')return (col==='workouts'||col==='sessions')&&MYUID?`members/${MYUID}/${col}`:null;
  if(col==='workouts'||col==='sessions'){const a=col==='workouts'?obj.assignee:obj.athlete;const c=a&&a!=='me'&&clById(a);if(c&&c.uid)return `members/${c.uid}/${col}`}
  return col}
function findItem(col,id){const L=col==='exercises'?S.exDb:col==='sessions'?S.sessDb.concat(S.sessions):col==='workouts'?S.workouts:S.clients;return L.find(x=>x.id===id)}
function put(col,obj){
  obj=clone(obj);obj.updatedAt=Date.now();const old=obj._p;delete obj._p;
  const path=colPath(col,obj);if(!path){toast('This view can’t change that','err');return Promise.resolve()}
  if(old&&old!==path&&SRC[old])SRC[old]=SRC[old].filter(x=>x.id!==obj.id);
  const arr=SRC[path]||(SRC[path]=[]);const i=arr.findIndex(x=>x.id===obj.id);const row={...obj,_p:path};if(i>=0)arr[i]=row;else arr.push(row);
  recompute();
  if(!CLOUD){saveLocal();return Promise.resolve()}
  const body=clone(obj);delete body.id;
  let p=queue(path+'/'+obj.id,()=>DB.collection(path).doc(obj.id).set(body));
  if(old&&old!==path)p=p.then(()=>queue(old+'/'+obj.id,()=>DB.collection(old).doc(obj.id).delete()));
  return p;
}
function del(col,id){
  const item=findItem(col,id);
  if((col==='exercises'&&PACK.some(e=>e.id===id))||(col==='sessions'&&SPACK.some(e=>e.id===id))){const t={id,deleted:true};if(item&&item._p)t._p=item._p;if(col==='sessions'&&item)t.athlete=item.athlete;return put(col,t)}
  const path=(item&&item._p)||col;SRC[path]=(SRC[path]||[]).filter(x=>x.id!==id);recompute();
  if(!CLOUD){saveLocal();return Promise.resolve()}
  return queue(path+'/'+id,()=>DB.collection(path).doc(id).delete());
}

function drawLine(fig){
  const c=CHARTS[fig.dataset.chart];const s=$('svg',fig);if(!c||!s)return;const W=fig.clientWidth,H=fig.clientHeight;if(!W)return;
  const P=c.pts;const L=W<520?36:48,R=22,T=26,B=34;const vs=P.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);if(lo===hi){lo-=lo*.1||1;hi+=hi*.1||1}const pd=(hi-lo)*.12;lo=Math.max(0,lo-pd);hi+=pd;
  const x=i=>P.length===1?(L+W-R)/2:L+(W-L-R)*i/(P.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g='';for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,yy=y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="currentColor" stroke-opacity=".1"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${Math.round(v)}</text>`}
  const line=P.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');
  const area=line+`L${x(P.length-1)},${H-B}L${x(0)},${H-B}Z`;
  let best=-1,bi=0;P.forEach((p,i)=>{if(p.v>=best){best=p.v;bi=i}});
  const fd=d=>{const k=kdate(d);return MON[k.getMonth()]+' '+k.getDate()};
  const xl=`<text x="${x(0)}" y="${H-10}" text-anchor="${P.length===1?'middle':'start'}">${esc(fd(P[0].day))}</text>`+(P.length>1?`<text x="${x(P.length-1)}" y="${H-10}" text-anchor="end">${esc(fd(P[P.length-1].day))}</text>`:'');
  const dots=P.length<=40?P.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===bi?6:3.5}" fill="${i===bi?'#188e5c':'var(--bg)'}" stroke="${i===bi?'#fff':'currentColor'}" stroke-width="2"/>`).join(''):'';
  const bx=x(bi),by=y(P[bi].v);const lbl=`${fmtW(P[bi].v)} ${c.unit}`;const anchor=bx>W-80?'end':bx<L+60?'start':'middle';
  s.style.color='var(--ink)';
  s.innerHTML=`<defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#188e5c" stop-opacity=".22"/><stop offset="1" stop-color="#188e5c" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#ga)"/><path d="${line}" fill="none" stroke="#188e5c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}<text x="${bx}" y="${Math.max(14,by-12)}" text-anchor="${anchor}" style="fill:var(--ink);font-weight:700;font-size:13px">PR ${esc(lbl)}</text>`;
}

let PHUP=false;
function squareJpeg(file,size){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{try{const m=Math.min(im.naturalWidth,im.naturalHeight);if(!m)throw 0;const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');g.drawImage(im,(im.naturalWidth-m)/2,(im.naturalHeight-m)/2,m,m,0,0,size,size);URL.revokeObjectURL(url);c.toBlob(b=>b?res({blob:b,data:c.toDataURL('image/jpeg',.82)}):rej(0),'image/jpeg',.86)}catch(e){URL.revokeObjectURL(url);rej(e)}};im.onerror=()=>{URL.revokeObjectURL(url);rej(0)};im.src=url})}
async function uploadPhoto(file){
  if(!file||PHUP)return;
  if(CLOUD&&ROLE!=='coach'){toast('Only you (the app owner) can change this photo','err');return}
  PHUP=true;paintSheet('settings');
  try{
    let out;try{out=await squareJpeg(file,ASSETS?640:220)}catch(e){toast(/heic|heif/i.test(file.type+file.name)?'That photo format isn’t supported — pick a JPG or PNG':'Couldn’t read that photo — try another','err');return}
    if(ASSETS){const f=new File([out.blob],'profile.jpg',{type:'image/jpeg'});const r=await ASSETS.upload(f,{type:'image/jpeg'});S.settings.photo=r.id}
    else S.settings.photo=out.data;
    saveSettings();toast('Profile photo updated')
  }catch(err){toast(err&&err.code==='quota_or_state'?'Storage is full':'Upload failed — try again','err')}
  finally{PHUP=false;paintSheet('settings')}
}
async function uploadMedia(file){
  if(!file||!EDITEX)return;
  if(!ASSETS){toast(CLOUD?'Only editors can upload videos':'Uploads work once the app is published','err');return}
  if(file.size>20*1024*1024){toast('That file is over 20 MB — trim it or export at a lower quality','err');return}
  const ext=(file.name.split('.').pop()||'').toLowerCase();
  let type=file.type;if(type==='video/quicktime'||ext==='mov'||ext==='m4v')type='video/mp4';
  if(!type)type={mp4:'video/mp4',webm:'video/webm',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',webp:'image/webp',gif:'image/gif'}[ext]||'';
  if(!/^(video\/(mp4|webm)|image\/(jpeg|png|webp|gif))$/.test(type)){toast(/heic|heif/.test(type+ext)?'HEIC photos aren’t supported — use JPG or PNG':'Use an MP4, MOV, WebM video or a JPG/PNG photo','err');return}
  EDITEX._up=true;paintSheet('exedit');
  try{const r=await ASSETS.upload(file,{type});if(!EDITEX)return;EDITEX.mediaId=r.id;EDITEX.mediaType=type.startsWith('image')?'image':'video';toast('Uploaded')}
  catch(err){const c=err&&err.code;toast(c==='too_large'?'File is too large (20 MB max)':c==='unsupported_type'?'That file type isn’t supported':c==='quota_or_state'?'Video storage is full':'Upload failed — try again','err')}
  if(EDITEX){EDITEX._up=false;paintSheet('exedit')}
}

     if(blank(s.r)&&b.mode!=='amrap'){const n=firstNum(pl.r)??firstNum(pl.r2)??parseTarget(s.target,'reps');if(n!=null)s.r=n}

     const next=b.sets.find(x=>!x.done&&x!==s);if(next&&blank(next.w)&&!blank(s.w))next.w=s.w;

   }
   saveLive();paintLive();
 },

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');

function onField(e){const t=e.target;
  if(t.dataset.bf&&BUILD){BUILD[t.dataset.bf]=t.value;BUILD._dirty=true}
  else if(t.dataset.bs&&BUILD){const [i,j,f]=t.dataset.bs.split(',');const s=BUILD.blocks[+i]?.sets[+j];if(!s)return;s[f]=f==='rest'?+t.value:f==='t'?parseDur(t.value):(f==='w'||f==='w2'||f==='d'||f==='rpe')?num(t.value):t.value;BUILD._dirty=true}
  else if(t.dataset.bn!==undefined&&BUILD){BUILD.blocks[+t.dataset.bn].note=t.value;BUILD._dirty=true}
  else if(t.dataset.ls&&LIVE){const [j,f]=t.dataset.ls.split(',');const sets=LIVE.blocks[LIVE.idx]?.sets||[];const s=sets[+j];if(s){s[f]=t.value;(s._m=s._m||{})[f]=1;for(let k=+j+1;k<sets.length;k++){const n=sets[k];if(n.done||(n._m&&n._m[f]))continue;n[f]=t.value;const inp=document.querySelector(`[data-ls="${k},${f}"]`);if(inp)inp.value=t.value}saveLiveSoon()}}
  else if(t.dataset.lc!==undefined&&LIVE){const b=LIVE.blocks[+t.dataset.lc];if(b){b.cmt=t.value;saveLiveSoon()}}
  else if(t.dataset.lf&&LIVE){LIVE[t.dataset.lf]=t.value;saveLiveSoon()}
  else if(t.dataset.ef&&EDITEX){EDITEX[t.dataset.ef]=t.value}
  else if(t.dataset.cf&&EDITC){EDITC[t.dataset.cf]=t.value;if(t.dataset.cf==='name'){const a=$('#c-av');if(a)a.textContent=initials(t.value||'?')}}
  else if(t.id==='lib-q'){UI.libQ=t.value;UI.libN=60;$('#lib-grid').innerHTML=libGrid();after($('#lib-grid'))}
  else if(t.id==='pk-q'&&PICK){PICK.q=t.value;const l=$('#pk-list');l.innerHTML=pickList();after(l)}
  else if(t.id==='asg-date'&&ASG){ASG.date=t.value}
  else if(t.dataset.ch==='pgex'&&e.type==='change'){UI.pgEx=t.value;render()}
}
/* ---------- in-app number pad ---------- */
let KP=null;
const KPF={w:'Weight',r:'Reps',t:'Seconds',d:'Distance',rpe:'RPE'};
function kpEl(){let el=$('#kp');if(!el){el=document.createElement('div');el.id='kp';el.className='kp';el.setAttribute('role','dialog');el.setAttribute('aria-label','Number pad');document.body.appendChild(el);
  el.addEventListener('pointerdown',e=>e.preventDefault());
  el.addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(b&&!b.disabled)kpKey(b.dataset.k)})}return el}
function kpInput(){return KP&&$(`#live [data-ls="${KP.j},${KP.f}"]`)}
function kpStep(){const b=LIVE?.blocks[LIVE.idx];return {w:(b?.u==='lb'?(+S.settings.stepLb||5):(+S.settings.stepKg||2.5)),r:1,t:5,d:.1,rpe:.5}[KP.f]||1}
function kpOpen(inp){if(!LIVE)return;const [j,f]=inp.dataset.ls.split(',');KP={j:+j,f,idx:LIVE.idx,v:inp.value,fresh:true,dec:inp.dataset.kp==='dec'};kpPaint();$('#live').classList.add('kp-open');requestAnimationFrame(()=>{kpEl().classList.add('on');$('#live').style.setProperty('--kph',kpEl().offsetHeight+'px');kpReveal()})}
function kpReveal(){const i=kpInput(),sc=$('#live .lv-scroll');if(!i||!sc)return;const r=i.closest('.lset')?.getBoundingClientRect()||i.getBoundingClientRect();const top=window.innerWidth>=900?window.innerHeight:window.innerHeight-kpEl().offsetHeight;const d=r.bottom-(top-20);if(d>0||r.top<130)sc.scrollBy({top:d>0?d:r.top-130,behavior:'smooth'})}
function kpClose(){if(!KP)return;KP=null;$$('#live .kp-on').forEach(x=>x.classList.remove('kp-on'));const el=$('#kp');el&&el.classList.remove('on');$('#live')?.classList.remove('kp-open')}
function kpPaint(){const el=kpEl();el.classList.toggle('light',LTH==='light');$$('#live .kp-on').forEach(x=>x.classList.remove('kp-on'));const inp=kpInput();if(!inp){kpClose();return}inp.classList.add('kp-on');
  const b=LIVE.blocks[LIVE.idx];const u=KP.f==='w'?(b.u||'kg'):KP.f==='t'?'sec':KP.f==='d'?'km':KP.f==='r'?'reps':'';const nxt=kpNext();
  el.innerHTML=`<div class="kp-h"><div><div class="kp-l">Set ${KP.j+1} · ${KPF[KP.f]||'Value'}</div><div class="kp-v ${KP.v===''?'ph':''}">${esc(KP.v===''?(inp.placeholder&&inp.placeholder!=='—'?inp.placeholder:'0'):KP.v)}${u?`<small>${u}</small>`:''}</div></div><button class="kp-done" data-k="done" type="button">Done</button></div>
  <div class="kp-g">${['1','2','3','bs','4','5','6','-','7','8','9','+'].map(k=>k==='bs'?`<button data-k="bs" aria-label="Delete" type="button"><svg width="26" height="20" viewBox="0 0 26 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M8 2h15a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 23 18H8l-6.5-8z"/><path d="M12.5 6.5l7 7M19.5 6.5l-7 7"/></svg></button>`:k==='-'||k==='+'?`<button class="kp-s" data-k="${k}" aria-label="${k==='+'?'Increase':'Decrease'}" type="button">${k==='+'?'+':'−'}${String(kpStep())}</button>`:`<button data-k="${k}" type="button">${k}</button>`).join('')}
  <button data-k="." ${KP.dec?'':'disabled'} aria-label="Decimal point" type="button">.</button><button data-k="0" type="button">0</button><button class="kp-n" data-k="next" type="button">${nxt?'Next':'Done'}${nxt?ic('right',18):ic('check',18)}</button></div>`}
function kpNext(){const ins=$$('#live [data-ls]');const i=ins.indexOf(kpInput());return i>=0&&i<ins.length-1?ins[i+1]:null}
function kpCommit(){const inp=kpInput();if(!inp)return;inp.value=KP.v;inp.dispatchEvent(new Event('input',{bubbles:true}))}
function kpKey(k){if(!KP)return;haptic();if(!KP)return;if(!LIVE||LIVE.idx!==KP.idx){kpClose();return}
  if(k==='done'){kpClose();return}
  if(k==='next'){const n=kpNext();if(n){kpOpen(n)}else kpClose();return}
  let v=KP.fresh?'':KP.v;
  if(k==='bs'){v=(KP.fresh?KP.v:v).slice(0,-1)}
  else if(k==='+'||k==='-'){const cur=num(KP.v)||0;const st=kpStep();let n=Math.max(0,Math.round((cur+(k==='+'?st:-st))*100)/100);v=n?String(n):'0'}
  else if(k==='.'){if(!KP.dec||v.includes('.'))return;v=(v||'0')+'.'}
  else{if(v.replace('.','').length>=6)return;v=v==='0'?k:v+k}
  KP.v=v;KP.fresh=false;kpCommit();kpPaint()}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-hsw]'))return;const inp=e.target.closest&&e.target.closest('#live input[data-kp]');if(inp){e.preventDefault();kpOpen(inp);return}
  if(KP&&!e.target.closest('#kp'))kpClose()},true);
document.addEventListener('keydown',e=>{if(!KP||e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key;
  if(/^[0-9]$/.test(k)||k==='.'){kpKey(k)}else if(k==='Backspace'){kpKey('bs')}else if(k==='Enter'||k==='Tab'){kpKey('next')}else if(k==='Escape'){kpKey('done')}else if(k==='ArrowUp'){kpKey('+')}else if(k==='ArrowDown'){kpKey('-')}else return;e.preventDefault();e.stopPropagation()},true);
(()=>{let y0=null,x0=0;const isPad=el=>el&&el.tagName==='INPUT'&&/^(decimal|numeric)$/.test(el.getAttribute('inputmode')||'')||el&&el.type==='number';

  if(e.key==='Enter'&&e.target.matches('.lin input')){e.preventDefault();const row=e.target.closest('.lset');const ins=$$('input',row);const k=ins.indexOf(e.target);if(k<ins.length-1)ins[k+1].focus();else $('.chk',row).click()}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c){e.dataTransfer.setData('text/plain','w:'+c.dataset.drag);e.dataTransfer.effectAllowed='copyMove'}});

/* ---------- routing & boot ---------- */
const COACH_VIEWS=['today','calendar','workouts','clients','library','progress'],CLIENT_VIEWS=['today','workouts','library','progress'];
function joinCode(){const m=decodeURIComponent(location.hash.slice(1)).match(/^join-([A-Za-z0-9]{6,32})$/);return m?m[1]:null}
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(ROLE==='client'){CM=PROFILE&&PROFILE.cid||null;if(!CLIENT_VIEWS.includes(UI.view))UI.view='today';render();return}
  const m=h.match(/^client-([A-Za-z0-9_-]+)$/);
  if(m){CM=m[1];if(!CLIENT_VIEWS.includes(UI.view))UI.view='today'}
  else{CM=null;UI.view=COACH_VIEWS.includes(h)?h:(UI.view&&COACH_VIEWS.includes(UI.view)&&!h?'today':'today')}
  render();
}
window.addEventListener('hashchange',()=>{MENU=null;while(STACK.length)closeSheet(true);route();window.scrollTo(0,0)});
function boot(){if(READY)return;READY=true;try{const l=JSON.parse(localStorage.getItem(LIVEK)||'null');if(l&&l.blocks)LIVE=l}catch(e){}route();if(LIVE){renderResume();startTick()}}
function subCol(path,onRows){if(SUBS[path])return;SUBS[path]=DB.collection(path).onSnapshot(snap=>{SRC[path]=snap.docs.map(d=>({...clone(d.data()||{}),id:d.id,_p:path}));GOT.add(path);onRows&&onRows();recompute();maybeBoot()},err=>{GOT.add(path);maybeBoot();if(err&&err.code!=='revoked')toast('Some data couldn’t load','err')})}
function subDoc(path,cb){if(SUBS[path])return;SUBS[path]=DB.doc(path).onSnapshot(d=>{cb(d.exists?clone(d.data()):null);GOT.add(path);maybeBoot()},()=>{cb(null);GOT.add(path);maybeBoot()})}
const GOT=new Set();let NEED=[],BOOTT=null;
function maybeBoot(){if(!READY&&NEED.every(k=>GOT.has(k))){clearTimeout(BOOTT);boot()}else if(READY)scheduleRender()}
function ensureMemberSubs(){for(const c of S.clients)if(c.uid&&safeId(c.uid)){subCol(`members/${c.uid}/workouts`);subCol(`members/${c.uid}/sessions`)}}
const profileFor=c=>({cid:c.id,name:c.name,perWeek:+c.perWeek||3,color:c.color||'#188e5c',archiveId:ARCHIDS[c.id]||null,linkedAt:c.linkedAt||Date.now()});
function processJoins(){
  if(ROLE!=='coach'||!CLOUD)return;
  for(const row of SRC.members||[]){if(!row.join||row.cid)continue;const c=S.clients.find(x=>x.code===row.join);if(c&&!c.uid)linkClient(c,row.id)}
}
async function linkClient(c,u){
  if(LINKING.has(c.id)||!safeId(u))return;LINKING.add(c.id);toast(`Connecting ${c.name}…`);
  const nc={...c,uid:u,linkedAt:Date.now()};delete nc._p;await put('clients',nc);
  await queue('members/'+u,()=>DB.doc('members/'+u).set(profileFor(nc)));
  ensureMemberSubs();
  for(const w of S.workouts.filter(w=>w.assignee===c.id&&w._p==='workouts'))await put('workouts',w);
  for(const x of S.sessDb.filter(x=>x.athlete===c.id&&x._p==='sessions'))await put('sessions',x);
  LINKING.delete(c.id);toast(`${c.name} is connected`);
}
function syncProfile(c){if(CLOUD&&ROLE==='coach'&&c.uid&&safeId(c.uid))queue('members/'+c.uid,()=>DB.doc('members/'+c.uid).set(profileFor(c)))}
async function init(){
  await loadPack();
  let useFn=null;try{useFn=window.claude&&typeof window.claude.use==='function'?window.claude.use.bind(window.claude):null}catch(e){}
  if(!useFn){loadLocal();boot();return}
  const to=new Promise(r=>setTimeout(()=>r(null),10000));
  const [db,user,assets]=await Promise.all([Promise.race([useFn('db'),to]),Promise.race([useFn('user'),to]),Promise.race([useFn('assets'),to])]).catch(()=>[null,null,null]);
  USER=user;ASSETS=assets;
  if(!db){loadLocal();boot();return}
  DB=db;CLOUD=true;
  let edit=false;try{edit=user?await user.canEdit():false}catch(e){}
  ROLE=edit?'coach':'client';
  BOOTT=setTimeout(()=>{if(!READY){boot();toast('Still connecting — showing what’s loaded so far','err')}},10000);
  subDoc('settings/app',d=>{if(d)S.settings={...S.settings,...d};scheduleRender()});
  subCol('exercises');
  if(ROLE==='coach'){
    NEED=['settings/app','exercises','clients','workouts','sessions'];
    subCol('clients',ensureMemberSubs);subCol('workouts');subCol('sessions');subCol('members',processJoins);
    subDoc('private/archives',d=>{ARCHIDS=d||{};for(const [cid,id] of Object.entries(ARCHIDS))loadArchive(cid,id)});
  }else{
    try{MYUID=user?await user.id():null}catch(e){MYUID=null}
    if(!MYUID||!safeId(MYUID)){boot();return}
    NEED=['settings/app','exercises','members/'+MYUID];
    subDoc('members/'+MYUID,d=>{PROFILE=d;
      if(d&&d.cid){subCol(`members/${MYUID}/workouts`);subCol(`members/${MYUID}/sessions`);if(d.archiveId)loadArchive(d.cid,d.archiveId)}
      else{const code=joinCode();if(code&&(!d||d.join!==code))DB.doc('members/'+MYUID).set({join:code,at:Date.now()}).catch(()=>{})}
      recompute();if(READY)route()});
  }
}
init();
}
